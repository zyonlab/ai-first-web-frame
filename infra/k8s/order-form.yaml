# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image order-form=$REGISTRY_URL/order-form:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-form
  labels:
    app.kubernetes.io/name: order-form
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-form
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-form
    spec:
      containers:
        - name: order-form
          image: order-form:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4205
          env:
            - name: PORT
              value: "4205"
          readinessProbe:
            httpGet:
              path: /health
              port: 4205
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4205
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-form
spec:
  selector:
    app.kubernetes.io/name: order-form
  ports:
    - name: http
      port: 4205
      targetPort: 4205
