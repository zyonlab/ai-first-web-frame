# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image promotion-banner=$REGISTRY_URL/promotion-banner:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-banner
  labels:
    app.kubernetes.io/name: promotion-banner
    app.kubernetes.io/part-of: ai-micro-component-mvp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: promotion-banner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promotion-banner
    spec:
      containers:
        - name: promotion-banner
          image: promotion-banner:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4201
          env:
            - name: PORT
              value: "4201"
          readinessProbe:
            httpGet:
              path: /health
              port: 4201
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4201
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-banner
spec:
  selector:
    app.kubernetes.io/name: promotion-banner
  ports:
    - name: http
      port: 4201
      targetPort: 4201
