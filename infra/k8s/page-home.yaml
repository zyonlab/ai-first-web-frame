apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-home
  labels:
    app.kubernetes.io/name: page-home
    app.kubernetes.io/part-of: ai-micro-component-mvp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: page-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: page-home
    spec:
      containers:
        - name: page-home
          image: page-home:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4101
          env:
            - name: PORT
              value: "4101"
---
apiVersion: v1
kind: Service
metadata:
  name: page-home
spec:
  selector:
    app.kubernetes.io/name: page-home
  ports:
    - name: http
      port: 4101
      targetPort: 4101
