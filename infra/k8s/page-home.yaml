# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image page-home=$REGISTRY_URL/page-home:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-home
  labels:
    app.kubernetes.io/name: page-home
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: page-home
  template:
    metadata:
      labels:
        app.kubernetes.io/name: page-home
    spec:
      containers:
        - name: page-home
          image: page-home:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4101
          env:
            - name: PORT
              value: "4101"
            # In-cluster fragment endpoints for the slots this page's
            # manifest.slots.json mounts (validated as URLs at boot).
            - name: PROMOTION_BANNER_URL
              value: "http://promotion-banner:4201"
            - name: RECOMMENDATION_WIDGET_URL
              value: "http://recommendation-widget:4202"
          # Probes hit the dedicated app/health/route.ts (static, dependency
          # free — never fans out into fragment calls).
          readinessProbe:
            httpGet:
              path: /health
              port: 4101
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4101
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: page-home
spec:
  selector:
    app.kubernetes.io/name: page-home
  ports:
    - name: http
      port: 4101
      targetPort: 4101
