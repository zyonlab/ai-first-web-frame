# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image page-referrals=$REGISTRY_URL/page-referrals:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-referrals
  labels:
    app.kubernetes.io/name: page-referrals
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: page-referrals
  template:
    metadata:
      labels:
        app.kubernetes.io/name: page-referrals
    spec:
      containers:
        - name: page-referrals
          image: page-referrals:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4107
          env:
            - name: PORT
              value: "4107"
          # Probes hit the dedicated app/health/route.ts (static, dependency
          # free — never fans out into fragment calls).
          readinessProbe:
            httpGet:
              path: /health
              port: 4107
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4107
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: page-referrals
spec:
  selector:
    app.kubernetes.io/name: page-referrals
  ports:
    - name: http
      port: 4107
      targetPort: 4107
