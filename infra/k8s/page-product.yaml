# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image page-product=$REGISTRY_URL/page-product:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-product
  labels:
    app.kubernetes.io/name: page-product
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: page-product
  template:
    metadata:
      labels:
        app.kubernetes.io/name: page-product
    spec:
      containers:
        - name: page-product
          image: page-product:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4102
          env:
            - name: PORT
              value: "4102"
            # In-cluster fragment endpoints for the slots this page's
            # manifest.slots.json mounts (validated as URLs at boot).
            - name: PROMOTION_BANNER_URL
              value: "http://promotion-banner:4201"
            - name: RECOMMENDATION_WIDGET_URL
              value: "http://recommendation-widget:4202"
          # Probes hit the dedicated app/health/route.ts (static, dependency
          # free — never fans out into fragment calls).
          readinessProbe:
            httpGet:
              path: /health
              port: 4102
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4102
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: page-product
spec:
  selector:
    app.kubernetes.io/name: page-product
  ports:
    - name: http
      port: 4102
      targetPort: 4102
