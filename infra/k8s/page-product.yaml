# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image page-product=$REGISTRY_URL/page-product:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-product
  labels:
    app.kubernetes.io/name: page-product
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: page-product
  template:
    metadata:
      labels:
        app.kubernetes.io/name: page-product
    spec:
      containers:
        - name: page-product
          image: page-product:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4102
          env:
            - name: PORT
              value: "4102"
          # The Next.js page app does not expose /health yet (observability
          # gap). GET / redirects to /product/123; kubelet treats any
          # 2xx/3xx as probe success, so the root path works as the probe.
          readinessProbe:
            httpGet:
              path: /
              port: 4102
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 4102
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: page-product
spec:
  selector:
    app.kubernetes.io/name: page-product
  ports:
    - name: http
      port: 4102
      targetPort: 4102
