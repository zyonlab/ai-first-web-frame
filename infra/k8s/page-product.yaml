apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-product
  labels:
    app.kubernetes.io/name: page-product
    app.kubernetes.io/part-of: ai-micro-component-mvp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: page-product
  template:
    metadata:
      labels:
        app.kubernetes.io/name: page-product
    spec:
      containers:
        - name: page-product
          image: page-product:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4102
          env:
            - name: PORT
              value: "4102"
---
apiVersion: v1
kind: Service
metadata:
  name: page-product
spec:
  selector:
    app.kubernetes.io/name: page-product
  ports:
    - name: http
      port: 4102
      targetPort: 4102
