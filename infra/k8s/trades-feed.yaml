# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image trades-feed=$REGISTRY_URL/trades-feed:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trades-feed
  labels:
    app.kubernetes.io/name: trades-feed
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trades-feed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trades-feed
    spec:
      containers:
        - name: trades-feed
          image: trades-feed:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4206
          env:
            - name: PORT
              value: "4206"
          readinessProbe:
            httpGet:
              path: /health
              port: 4206
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4206
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trades-feed
spec:
  selector:
    app.kubernetes.io/name: trades-feed
  ports:
    - name: http
      port: 4206
      targetPort: 4206
