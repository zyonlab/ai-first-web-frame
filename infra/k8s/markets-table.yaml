# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image markets-table=$REGISTRY_URL/markets-table:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: markets-table
  labels:
    app.kubernetes.io/name: markets-table
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: markets-table
  template:
    metadata:
      labels:
        app.kubernetes.io/name: markets-table
    spec:
      containers:
        - name: markets-table
          image: markets-table:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4212
          env:
            - name: PORT
              value: "4212"
          readinessProbe:
            httpGet:
              path: /health
              port: 4212
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4212
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: markets-table
spec:
  selector:
    app.kubernetes.io/name: markets-table
  ports:
    - name: http
      port: 4212
      targetPort: 4212
