# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image market-header=$REGISTRY_URL/market-header:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-header
  labels:
    app.kubernetes.io/name: market-header
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: market-header
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-header
    spec:
      containers:
        - name: market-header
          image: market-header:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4203
          env:
            - name: PORT
              value: "4203"
          readinessProbe:
            httpGet:
              path: /health
              port: 4203
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4203
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: market-header
spec:
  selector:
    app.kubernetes.io/name: market-header
  ports:
    - name: http
      port: 4203
      targetPort: 4203
