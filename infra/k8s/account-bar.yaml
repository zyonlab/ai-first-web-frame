# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image account-bar=$REGISTRY_URL/account-bar:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-bar
  labels:
    app.kubernetes.io/name: account-bar
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: account-bar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-bar
    spec:
      containers:
        - name: account-bar
          image: account-bar:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4207
          env:
            - name: PORT
              value: "4207"
          readinessProbe:
            httpGet:
              path: /health
              port: 4207
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4207
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: account-bar
spec:
  selector:
    app.kubernetes.io/name: account-bar
  ports:
    - name: http
      port: 4207
      targetPort: 4207
