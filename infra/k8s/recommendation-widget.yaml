# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image recommendation-widget=$REGISTRY_URL/recommendation-widget:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-widget
  labels:
    app.kubernetes.io/name: recommendation-widget
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation-widget
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation-widget
    spec:
      containers:
        - name: recommendation-widget
          image: recommendation-widget:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4202
          env:
            - name: PORT
              value: "4202"
          readinessProbe:
            httpGet:
              path: /health
              port: 4202
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4202
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-widget
spec:
  selector:
    app.kubernetes.io/name: recommendation-widget
  ports:
    - name: http
      port: 4202
      targetPort: 4202
