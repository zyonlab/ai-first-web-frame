# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image shell-gateway=$REGISTRY_URL/shell-gateway:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell-gateway
  labels:
    app.kubernetes.io/name: shell-gateway
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shell-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shell-gateway
    spec:
      containers:
        - name: shell-gateway
          image: shell-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4100
          env:
            - name: PORT
              value: "4100"
            # In-cluster page endpoints for the route registry
            # (PAGE_<NAME>_URL overrides, validated as URLs at boot).
            - name: PAGE_HOME_URL
              value: "http://page-home:4101"
            - name: PAGE_PRODUCT_URL
              value: "http://page-product:4102"
            - name: PAGE_TRADE_URL
              value: "http://page-trade:4103"
            - name: PAGE_MARKETS_URL
              value: "http://page-markets:4104"
            - name: PAGE_PORTFOLIO_URL
              value: "http://page-portfolio:4105"
            - name: PAGE_VAULTS_URL
              value: "http://page-vaults:4106"
            - name: PAGE_REFERRALS_URL
              value: "http://page-referrals:4107"
          readinessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shell-gateway
spec:
  selector:
    app.kubernetes.io/name: shell-gateway
  ports:
    - name: http
      port: 80
      targetPort: 4100
