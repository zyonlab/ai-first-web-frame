apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell-gateway
  labels:
    app.kubernetes.io/name: shell-gateway
    app.kubernetes.io/part-of: ai-micro-component-mvp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shell-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shell-gateway
    spec:
      containers:
        - name: shell-gateway
          image: shell-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4100
          env:
            - name: PORT
              value: "4100"
          readinessProbe:
            httpGet:
              path: /health
              port: 4100
---
apiVersion: v1
kind: Service
metadata:
  name: shell-gateway
spec:
  selector:
    app.kubernetes.io/name: shell-gateway
  ports:
    - name: http
      port: 80
      targetPort: 4100
