# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image positions-table=$REGISTRY_URL/positions-table:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: positions-table
  labels:
    app.kubernetes.io/name: positions-table
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: positions-table
  template:
    metadata:
      labels:
        app.kubernetes.io/name: positions-table
    spec:
      containers:
        - name: positions-table
          image: positions-table:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4208
          env:
            - name: PORT
              value: "4208"
          readinessProbe:
            httpGet:
              path: /health
              port: 4208
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4208
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: positions-table
spec:
  selector:
    app.kubernetes.io/name: positions-table
  ports:
    - name: http
      port: 4208
      targetPort: 4208
