# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image page-vaults=$REGISTRY_URL/page-vaults:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-vaults
  labels:
    app.kubernetes.io/name: page-vaults
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: page-vaults
  template:
    metadata:
      labels:
        app.kubernetes.io/name: page-vaults
    spec:
      containers:
        - name: page-vaults
          image: page-vaults:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4106
          env:
            - name: PORT
              value: "4106"
          # Probes hit the dedicated app/health/route.ts (static, dependency
          # free — never fans out into fragment calls).
          readinessProbe:
            httpGet:
              path: /health
              port: 4106
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4106
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: page-vaults
spec:
  selector:
    app.kubernetes.io/name: page-vaults
  ports:
    - name: http
      port: 4106
      targetPort: 4106
