# Image tag is parameterized through kustomization.yaml (images transformer).
# CI/CD sets the release tag with:
#   kustomize edit set image chart-panel=$REGISTRY_URL/chart-panel:$GIT_SHA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-panel
  labels:
    app.kubernetes.io/name: chart-panel
    app.kubernetes.io/part-of: ai-first-web-frame
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chart-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chart-panel
    spec:
      containers:
        - name: chart-panel
          image: chart-panel:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4211
          env:
            - name: PORT
              value: "4211"
          readinessProbe:
            httpGet:
              path: /health
              port: 4211
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4211
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chart-panel
spec:
  selector:
    app.kubernetes.io/name: chart-panel
  ports:
    - name: http
      port: 4211
      targetPort: 4211
