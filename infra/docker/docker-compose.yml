services:
  shell-gateway:
    build:
      context: ../..
      dockerfile: apps/shell-gateway/Dockerfile
    ports:
      - "4100:4100"
    environment:
      PORT: "4100"
      PAGE_HOME_URL: "http://page-home:4101"
      PAGE_PRODUCT_URL: "http://page-product:4102"
    depends_on:
      - page-home
      - page-product

  page-home:
    build:
      context: ../..
      dockerfile: apps/page-home/Dockerfile
    ports:
      - "4101:4101"
    environment:
      PORT: "4101"
      PROMOTION_BANNER_URL: "http://promotion-banner:4201"
      RECOMMENDATION_WIDGET_URL: "http://recommendation-widget:4202"
    depends_on:
      - promotion-banner
      - recommendation-widget

  page-product:
    build:
      context: ../..
      dockerfile: apps/page-product/Dockerfile
    ports:
      - "4102:4102"
    environment:
      PORT: "4102"
      PROMOTION_BANNER_URL: "http://promotion-banner:4201"
      RECOMMENDATION_WIDGET_URL: "http://recommendation-widget:4202"
    depends_on:
      - promotion-banner
      - recommendation-widget

  promotion-banner:
    build:
      context: ../..
      dockerfile: fragments/promotion-banner/Dockerfile
    ports:
      - "4201:4201"
    environment:
      PORT: "4201"

  recommendation-widget:
    build:
      context: ../..
      dockerfile: fragments/recommendation-widget/Dockerfile
    ports:
      - "4202:4202"
    environment:
      PORT: "4202"

  market-header:
    build:
      context: ../..
      dockerfile: fragments/market-header/Dockerfile
    ports:
      - "4203:4203"
    environment:
      PORT: "4203"

  order-book:
    build:
      context: ../..
      dockerfile: fragments/order-book/Dockerfile
    ports:
      - "4204:4204"
    environment:
      PORT: "4204"

  order-form:
    build:
      context: ../..
      dockerfile: fragments/order-form/Dockerfile
    ports:
      - "4205:4205"
    environment:
      PORT: "4205"

  trades-feed:
    build:
      context: ../..
      dockerfile: fragments/trades-feed/Dockerfile
    ports:
      - "4206:4206"
    environment:
      PORT: "4206"

  account-bar:
    build:
      context: ../..
      dockerfile: fragments/account-bar/Dockerfile
    ports:
      - "4207:4207"
    environment:
      PORT: "4207"

  positions-table:
    build:
      context: ../..
      dockerfile: fragments/positions-table/Dockerfile
    ports:
      - "4208:4208"
    environment:
      PORT: "4208"

  open-orders:
    build:
      context: ../..
      dockerfile: fragments/open-orders/Dockerfile
    ports:
      - "4209:4209"
    environment:
      PORT: "4209"

  funding-bar:
    build:
      context: ../..
      dockerfile: fragments/funding-bar/Dockerfile
    ports:
      - "4210:4210"
    environment:
      PORT: "4210"
