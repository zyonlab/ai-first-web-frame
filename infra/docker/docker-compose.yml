services:
  shell-gateway:
    build:
      context: ../..
      dockerfile: apps/shell-gateway/Dockerfile
    ports:
      - "4100:4100"
    environment:
      PORT: "4100"
      PAGE_HOME_URL: "http://page-home:4101"
      PAGE_PRODUCT_URL: "http://page-product:4102"
      PAGE_TRADE_URL: "http://page-trade:4103"
    depends_on:
      - page-home
      - page-product
      - page-trade

  page-home:
    build:
      context: ../..
      dockerfile: apps/page-home/Dockerfile
    ports:
      - "4101:4101"
    environment:
      PORT: "4101"
      PROMOTION_BANNER_URL: "http://promotion-banner:4201"
      RECOMMENDATION_WIDGET_URL: "http://recommendation-widget:4202"
    depends_on:
      - promotion-banner
      - recommendation-widget

  page-product:
    build:
      context: ../..
      dockerfile: apps/page-product/Dockerfile
    ports:
      - "4102:4102"
    environment:
      PORT: "4102"
      PROMOTION_BANNER_URL: "http://promotion-banner:4201"
      RECOMMENDATION_WIDGET_URL: "http://recommendation-widget:4202"
    depends_on:
      - promotion-banner
      - recommendation-widget

  page-trade:
    build:
      context: ../..
      dockerfile: apps/page-trade/Dockerfile
    ports:
      - "4103:4103"
    environment:
      PORT: "4103"
      MARKET_HEADER_URL: "http://market-header:4203"
      ORDER_BOOK_URL: "http://order-book:4204"
      ORDER_FORM_URL: "http://order-form:4205"
      TRADES_FEED_URL: "http://trades-feed:4206"
      ACCOUNT_BAR_URL: "http://account-bar:4207"
      POSITIONS_TABLE_URL: "http://positions-table:4208"
      OPEN_ORDERS_URL: "http://open-orders:4209"
      FUNDING_BAR_URL: "http://funding-bar:4210"
      CHART_PANEL_URL: "http://chart-panel:4211"
    depends_on:
      - market-header
      - order-book
      - order-form
      - trades-feed
      - account-bar
      - positions-table
      - open-orders
      - funding-bar
      - chart-panel

  promotion-banner:
    build:
      context: ../..
      dockerfile: fragments/promotion-banner/Dockerfile
    ports:
      - "4201:4201"
    environment:
      PORT: "4201"

  recommendation-widget:
    build:
      context: ../..
      dockerfile: fragments/recommendation-widget/Dockerfile
    ports:
      - "4202:4202"
    environment:
      PORT: "4202"

  market-header:
    build:
      context: ../..
      dockerfile: fragments/market-header/Dockerfile
    ports:
      - "4203:4203"
    environment:
      PORT: "4203"

  order-book:
    build:
      context: ../..
      dockerfile: fragments/order-book/Dockerfile
    ports:
      - "4204:4204"
    environment:
      PORT: "4204"

  order-form:
    build:
      context: ../..
      dockerfile: fragments/order-form/Dockerfile
    ports:
      - "4205:4205"
    environment:
      PORT: "4205"

  trades-feed:
    build:
      context: ../..
      dockerfile: fragments/trades-feed/Dockerfile
    ports:
      - "4206:4206"
    environment:
      PORT: "4206"

  account-bar:
    build:
      context: ../..
      dockerfile: fragments/account-bar/Dockerfile
    ports:
      - "4207:4207"
    environment:
      PORT: "4207"

  positions-table:
    build:
      context: ../..
      dockerfile: fragments/positions-table/Dockerfile
    ports:
      - "4208:4208"
    environment:
      PORT: "4208"

  open-orders:
    build:
      context: ../..
      dockerfile: fragments/open-orders/Dockerfile
    ports:
      - "4209:4209"
    environment:
      PORT: "4209"

  funding-bar:
    build:
      context: ../..
      dockerfile: fragments/funding-bar/Dockerfile
    ports:
      - "4210:4210"
    environment:
      PORT: "4210"

  chart-panel:
    build:
      context: ../..
      dockerfile: fragments/chart-panel/Dockerfile
    ports:
      - "4211:4211"
    environment:
      PORT: "4211"
