# CI/CD pipeline for the AI micro component MVP.
#
# Flow:
#   PR / push        -> verify (quality gates) + affected (unit detection)
#   push to main     -> docker matrix build of affected units, tagged
#                       <unit>:<git-sha> and <unit>:latest; pushed only when
#                       registry credentials are configured
#   main or 'e2e'    -> compose stack + smoke checks + Playwright e2e
#   PR label
#
# Registry configuration (all optional; without them images build but are not pushed):
#   vars.REGISTRY_URL          e.g. ghcr.io/acme or registry.example.com/mvp
#   secrets.REGISTRY_USERNAME
#   secrets.REGISTRY_PASSWORD

name: ci

on:
  # `labeled` is not one of pull_request's default activity types (those are
  # opened / synchronize / reopened), so without it the `e2e` label below could
  # be applied but would never trigger a run — the documented escape hatch was
  # inert. Listing the defaults explicitly is required once `types` is given.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      # Turbo's task cache across CI runs. Without this every job is cold and
      # `build`/`test` re-run in full; with it an unrelated change restores both
      # from cache. The key is content-addressed by turbo itself, so a stale
      # restore cannot produce a false pass — a changed input simply misses.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # `pnpm verify` captures each gate's stdout into the report rather than
      # streaming it, so a failing gate shows as `FAIL <cmd>` and nothing else
      # in the job log. Print the failing gate's own output so a CI-only
      # failure is diagnosable from the log alone.
      - name: Show failing gate output
        if: failure()
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "reports/verify-report.json";
            // `reports/` is committed, so a verify that died before writing
            // the report leaves the PREVIOUS run file on disk. Print
            // `generatedAt` so the log says which run this output came from.
            if (!fs.existsSync(path)) {
              console.log("no " + path + " — verify failed before writing it");
              process.exit(0);
            }
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            console.log("verify-report.json generatedAt=" + report.generatedAt);
            const failed = report.results.filter((x) => x.status === "failed");
            if (failed.length === 0) {
              console.log(
                "report lists no failed gate; verify likely crashed outside a gate",
              );
            }
            for (const entry of failed) {
              console.log("::group::" + entry.command);
              console.log(entry.stdout ?? "");
              console.log(entry.stderr ?? "");
              console.log("::endgroup::");
            }
          '
      - name: Upload verify reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: reports/
          retention-days: 7

  affected:
    runs-on: ubuntu-latest
    outputs:
      has_units: ${{ steps.affected.outputs.has_units }}
      units: ${{ steps.affected.outputs.units }}
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so merge-base diffs against the base ref work.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The graph engine (scripts/affected-graph.mts) reads each fragment's
      # manifest.ts via a real dynamic import, and a few manifests have
      # runtime (non-type-only) imports from workspace packages/domains — so
      # those need a built dist/ to resolve. Scoped to packages/+domains/
      # (fast tsdown builds) rather than the full `pnpm build` (which also
      # builds every Next.js app and is what `verify`'s own build gate does).
      - run: pnpm --filter "./packages/*" --filter "./domains/*" build
      - name: Compute affected deployable units
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            # Previous commit of the push; all zeros on force push/new branch,
            # which the script's base resolution (git rev-parse --verify)
            # detects as nonexistent and falls back from.
            BASE="${{ github.event.before }}"
          fi
          pnpm exec tsx scripts/affected-graph.mts --base "$BASE" --github-output "$GITHUB_OUTPUT"
          pnpm exec tsx scripts/affected-graph.mts --base "$BASE"

  docker:
    name: docker (${{ matrix.unit }})
    needs: [verify, affected]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.affected.outputs.has_units == 'true'
    runs-on: ubuntu-latest
    # The `secrets` context is NOT available in a step-level `if:` — GitHub
    # rejects the whole workflow at validation time with
    # "Unrecognized named-value: 'secrets'", which surfaces as a 0-second run
    # with no jobs and no logs. It IS available in a job-level `env`, and `env`
    # IS available in a step `if:`, so the check is hoisted here.
    env:
      REGISTRY_READY: ${{ vars.REGISTRY_URL != '' && secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        # Attestation export is disabled to mirror the documented local
        # constraint (README: provenance/SBOM export caused snapshot errors).
        run: >
          docker buildx build
          --provenance=false --sbom=false --load
          -f ${{ matrix.dockerfile }}
          -t ${{ matrix.unit }}:${{ github.sha }}
          -t ${{ matrix.unit }}:latest
          .
      - name: Log in to registry
        if: env.REGISTRY_READY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Push image
        if: env.REGISTRY_READY == 'true'
        run: |
          for TAG in "${{ github.sha }}" latest; do
            docker tag "${{ matrix.unit }}:$TAG" "${{ vars.REGISTRY_URL }}/${{ matrix.unit }}:$TAG"
            docker push "${{ vars.REGISTRY_URL }}/${{ matrix.unit }}:$TAG"
          done

  e2e:
    needs: [verify]
    # Runs on main pushes always; on PRs only when the 'e2e' label is set.
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build compose stack
        run: docker compose -f infra/docker/docker-compose.yml build --provenance=false --sbom=false
      - name: Start compose stack
        run: docker compose -f infra/docker/docker-compose.yml up -d --no-build
      # docker-smoke derives its full-fleet check list from
      # packages/routes/src/registry.ts at runtime, whose @mvp/contracts
      # import resolves to the built dist/ under tsx.
      - name: Build contracts dist for smoke derivation
        run: pnpm --filter @mvp/contracts build
      - name: Smoke check services
        run: pnpm exec tsx scripts/docker-smoke.mts --timeout 180
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Runtime gate (composed pages)
        # The browser-level defect classes pnpm verify can't see (hydration
        # errors, React #418, asset 4xx, layout voids, dead cross-island
        # wiring) — one run per composed shell route. Previously this gate
        # only existed behind the manual `deploy-affected --runtime` flag.
        run: |
          set -euo pipefail
          for route in / /product/123 /markets /portfolio /trade/BTC; do
            pnpm exec tsx scripts/verify-runtime.mts --url "http://localhost:4100${route}"
          done
      - name: Run e2e tests
        # Strict tier: the full compose stack is genuinely up in this job, so
        # fragment fallbacks are failures here, not acceptable degradation
        # (the loose default tier let a fully-degraded stack pass green).
        env:
          E2E_STRICT: "1"
        run: pnpm e2e
      - name: Collect compose logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color | tail -200
      - name: Stop compose stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
